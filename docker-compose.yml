services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: stockengine_api
      MARIADB_USER: stockengine
      MARIADB_PASSWORD: stockengine_dev
      MARIADB_ROOT_PASSWORD: root_dev
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: